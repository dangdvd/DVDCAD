# Dựng DVDCAD cho Windows (bộ cài NSIS + bản portable) trên máy Windows của GitHub.
# - Mỗi lần đẩy mã lên main / bấm "Run workflow": tải file .exe ở mục Artifacts của lần chạy.
# - Đẩy thẻ phiên bản (vd: git tag v5.9.0 && git push origin v5.9.0): tạo thêm GitHub Release kèm file .exe.
name: DVDCAD Windows

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
    paths:
      - 'index.html'
      - '*.js'
      - '*.wasm'
      - 'vendor/**'
      - 'addins/**'
      - 'desktop/**'
      - '.github/workflows/desktop-windows.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'dvd-desktop.js'
      - 'dvd-acad-start.js'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Cài Electron + electron-builder
        run: npm ci

      - name: Kiểm thử nhanh (mở DWG/DXF, hộp thoại Mở/Lưu, trang Bắt đầu)
        run: |
          npm install --no-save playwright@1.63.0
          node test/smoke.js

      - name: Dựng bộ cài và bản portable
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Cài thử bộ cài, chạy kiểm thử trên DVDCAD.exe đã cài, rồi gỡ cài
        run: node test/installed.js

      - uses: actions/upload-artifact@v4
        with:
          name: DVDCAD-Windows
          path: |
            desktop/dist/DVDCAD-Setup-*.exe
            desktop/dist/DVDCAD-*-portable.exe
          if-no-files-found: error

      - name: GitHub Release (khi đẩy thẻ v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DVDCAD ${{ github.ref_name }}
          body_path: desktop/RELEASE-NOTES.md
          files: |
            desktop/dist/DVDCAD-Setup-*.exe
            desktop/dist/DVDCAD-*-portable.exe
